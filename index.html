/* ---------- Report ---------- */
const keyDate = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const toKey = d => iso(d.getFullYear(), d.getMonth(), d.getDate());
const shortDate = k => { const d = keyDate(k); return `${d.getDate()}/${d.getMonth()+1}`; };
const longDate = k => { const d = keyDate(k); return `${d.getDate()} ${MONTHS[d.getMonth()].toLowerCase()} ${d.getFullYear()}`; };
function keysBetween(a, b){
  const out = []; if(!a || !b || a > b) return out;
  const d = keyDate(a), e = keyDate(b);
  while(d <= e){ out.push(toKey(d)); d.setDate(d.getDate()+1); }
  return out;
}
const RSH = [["1","06-14"],["1L","05:30-14"],["2","14-22"],["2L","14-22:30"],["C","07-15"],["M","Manuale"]];
function statsRange(p, keys){
  const st = {gg:0, ord:0, ot:0, f:0, par:0, mal:0, cig:0, vis:0, men:0, sh:{"1":0,"1L":0,"2":0,"2L":0,"C":0,"M":0}};
  for(const k of keys){
    const v = get("presenze",p,k);
    if(v!==undefined && !(isWorkday(k) && absH(p,k) >= DAY_H)){ st.gg++; const id = sid(v); if(id in st.sh) st.sh[id]++; }
    st.ord += worked(p,k); st.ot += otDay(p,k);
    const fe = get("ferie",p,k) || {}, fcig = fe.fc ? ferF(p,k) : 0, pcig = fe.pc ? ferP(p,k) : 0;   /* ferie/PAR "contate come CIGO" */
    st.f += ferF(p,k) - fcig; const mcig = malE(p,k).c ? malH(p,k) : 0; st.par += ferP(p,k) - pcig; st.mal += malH(p,k) - mcig; st.cig += cigH(p,k) + fcig + pcig + mcig; st.vis += visH(p,k); st.men += menH(p,k);
  }
  return st;
}
function addStats(a, b){
  const o = {gg:a.gg+b.gg, ord:a.ord+b.ord, ot:a.ot+b.ot, f:a.f+b.f, par:a.par+b.par, mal:a.mal+b.mal, cig:a.cig+b.cig, vis:a.vis+b.vis, men:a.men+b.men, sh:{}};
  for(const [k] of RSH) o.sh[k] = a.sh[k] + b.sh[k];
  return o;
}
const ZERO = () => statsRange("", []);
function monthRange(y, m){ return [iso(y,m,1), iso(y,m,new Date(y,m+1,0).getDate())]; }
const rep = (() => { const [a,b] = monthRange(now.getFullYear(), now.getMonth()); return {from:a, to:b, group:"week", who:"ALL", preset:"month"}; })();
function setPreset(pr){
  const t = new Date(), y = t.getFullYear(), m = t.getMonth();
  rep.preset = pr;
  if(pr==="week"){ const dow = (t.getDay()+6)%7; const a = new Date(y,m,t.getDate()-dow), b = new Date(y,m,t.getDate()-dow+6); rep.from = toKey(a); rep.to = toKey(b); }
  if(pr==="month") [rep.from, rep.to] = monthRange(y, m);
  if(pr==="prev") [rep.from, rep.to] = monthRange(m ? y : y-1, m ? m-1 : 11);
  if(pr==="cal") [rep.from, rep.to] = monthRange(state.y, state.m);
  if(pr==="year"){ rep.from = iso(y,0,1); rep.to = iso(y,11,31); }
}
function periodsOf(keys){
  const map = new Map();
  for(const k of keys){
    const d = keyDate(k);
    let id, label;
    if(rep.group==="week"){ const mon = new Date(d); mon.setDate(d.getDate() - (d.getDay()+6)%7); id = toKey(mon); }
    else if(rep.group==="month"){ id = k.slice(0,7); label = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
    else { id = k.slice(0,4); label = id; }
    if(!map.has(id)) map.set(id, {id, label, keys:[]});
    map.get(id).keys.push(k);
  }
  const out = [...map.values()];
  if(rep.group==="week") out.forEach(o => { o.label = `W${isoWeek(o.keys[0])} <small>${shortDate(o.keys[0])} – ${shortDate(o.keys[o.keys.length-1])}</small>`; });
  return out;
}
const HEAD = `<tr><th class="l"></th><th>Giorni</th><th class="c-pres">Ore ordinarie</th><th class="c-stra">Straord.</th><th>Totale ore</th><th class="c-ferie">Ferie</th><th class="c-par">PAR</th><th class="c-mal">Malattia</th><th class="c-cigo">CIGO</th><th class="c-vis">Visita med.</th><th class="c-men">Mensa</th>${RSH.map(([k,l]) => `<th class="sh"><span class="swd" style="--sw:var(${SHIFTS[k].color})"></span>${l}</th>`).join("")}</tr>`;
function rowHTML(label, st, cls = ""){
  const z = n => n ? fmt(n) : `<span class="zero">–</span>`;
  return `<tr class="${cls}"><th class="l">${label}</th><td>${z(st.gg)}</td><td class="c-pres">${z(st.ord)}</td><td class="c-stra">${z(st.ot)}</td><td class="tot">${z(st.ord+st.ot)}</td><td class="c-ferie">${z(st.f)}</td><td class="c-par">${z(st.par)}</td><td class="c-mal">${z(st.mal)}</td><td class="c-cigo">${z(st.cig)}</td><td class="c-vis">${z(st.vis)}</td><td class="c-men">${z(st.men)}</td>${RSH.map(([k]) => `<td class="sh">${z(st.sh[k])}</td>`).join("")}</tr>`;
}
function renderReport(){
  const keys = keysBetween(rep.from, rep.to);
  const presets = [["week","Questa settimana"],["month","Questo mese"],["prev","Mese scorso"],["cal",`${MONTHS[state.m]} ${state.y}`],["year","Quest'anno"]];
  let html = `<div class="rp-bar">
    <div class="rp-dates"><label>Dal<input type="date" id="rpFrom" value="${rep.from}"></label><label>Al<input type="date" id="rpTo" value="${rep.to}"></label></div>
    <div class="rp-pre">${presets.map(([k,l]) => `<button class="rp-chip" data-pr="${k}" aria-pressed="${rep.preset===k}">${l}</button>`).join("")}</div>
  </div>`;
  if(!keys.length){
    $("report").innerHTML = html + `<p class="rp-empty">La data di inizio viene dopo quella di fine: correggi le date.</p>` + backupHTML();
    return;
  }
  let tot = ZERO(); const per = {};
  for(const p of PEOPLE){ per[p] = statsRange(p, keys); tot = addStats(tot, per[p]); }
  html += `<h2 class="rp-h">Riepilogo dal ${longDate(keys[0])} al ${longDate(keys[keys.length-1])}</h2>
    <p class="rp-note">Ore ordinarie e straordinario in ore; le colonne dei turni contano i giorni lavorati in quel turno.</p>
    <div class="rp-scroll"><table class="rp"><thead>${HEAD.replace('<th class="l"></th>','<th class="l">Dipendente</th>')}</thead><tbody>
    ${PEOPLE.map(p => rowHTML(esc(p), per[p])).join("")}
    ${rowHTML("Totale reparto", tot, "sum")}</tbody></table></div>`;

  const groups = [["week","Settimana"],["month","Mese"],["year","Anno"]];
  html += `<div class="rp-bar2">
    <h2 class="rp-h">Dettaglio nome per nome</h2>
    <div class="seg2">${groups.map(([k,l]) => `<button class="rp-chip" data-gr="${k}" aria-pressed="${rep.group===k}">${l}</button>`).join("")}</div>
    <div class="seg2">${[["ALL","Tutti"], ...PEOPLE.map(p => [p, surname(p)])].map(([k,l]) => `<button class="rp-chip" data-who="${esc(k)}" aria-pressed="${rep.who===k}">${esc(l)}</button>`).join("")}</div>
  </div>`;
  const periods = periodsOf(keys);
  for(const p of PEOPLE){
    if(rep.who!=="ALL" && rep.who!==p) continue;
    const nm = p.split(" "), last = nm.pop();
    html += `<article class="rp-card"><h3>${esc(nm.join(" "))} <b>${esc(last)}</b><small>${fmt(per[p].ord+per[p].ot)} ore lavorate, di cui ${fmt(per[p].ot)} di straordinario</small></h3>
      <div class="rp-scroll"><table class="rp"><thead>${HEAD.replace('<th class="l"></th>',`<th class="l">${groups.find(g=>g[0]===rep.group)[1]}</th>`)}</thead><tbody>
      ${periods.map(o => rowHTML(o.label, statsRange(p, o.keys))).join("")}
      ${periods.length>1 ? rowHTML("Totale", per[p], "sum") : ""}</tbody></table></div></article>`;
  }
  $("report").innerHTML = html + backupHTML();
}
function backupHTML(){
  return `<div class="rp-data"><span><b>Dati dell'app</b><small>Salva una copia di tutti i dati o ricaricala, ad esempio per passare a un altro computer o all'app installata.</small></span>
    <span class="rp-dact"><button class="btn-o" id="bkSave">Salva backup</button><button class="btn-o" id="bkLoad">Carica backup</button><button class="btn-o" id="logoutBtn" title="Esci (servirà di nuovo email e password)">Esci</button><input type="file" id="bkFile" accept="application/json,.json" hidden></span></div>`;

function loadBackup(file){
  if(!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const o = JSON.parse(fr.result), d = o && o.data;
      if(!d || typeof d!=="object") throw 0;
      commit(() => { data = migrate(d); });
      alertMsg("Backup caricato. Se era quello sbagliato, premi Annulla.");
    }catch(e){ alertMsg("Questo file non è un backup dell'app."); }
  };
  fr.readAsText(file);

function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function applyTheme(t){
  const light = t==="light";
  if(light) document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme;
  $("themeBtn").innerHTML = light ? MOON : SUN;
  $("themeBtn").title = light ? "Passa al tema scuro" : "Passa al tema chiaro";
  $("themeBtn").setAttribute("aria-label", light ? "Passa al tema scuro" : "Passa al tema chiaro");
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", light ? "#F3F5F8" : "#08090B");
}
$("themeBtn").onclick = () => { const t = document.documentElement.dataset.theme==="light" ? "dark" : "light"; lsSet(THEME_KEY, t); applyTheme(t); };
applyTheme(lsGet(THEME_KEY) || "dark");

/* ---------- Installazione come app ---------- */
let installEvt = null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const framed = (() => { try{ return window.top !== window; }catch(e){ return true; } })();
function showInstall(mode){
  if(standalone || lsGet("registro-install-no")) return;
  $("installTitle").textContent = "Installa l'app sul computer";
  if(mode==="prompt"){
    $("installSub").textContent = "Si apre in una finestra sua, con l'icona nella barra delle applicazioni, anche senza internet.";
    $("installGo").textContent = "Installa";
  } else {
    $("installSub").textContent = "In Chrome apri il menu ⋮ in alto a destra, poi Trasmetti, salva e condividi e scegli Installa pagina come app (o Crea scorciatoia, spuntando Apri come finestra).";
    $("installGo").textContent = "Ho capito";
  }
  $("install").dataset.mode = mode;
  $("install").hidden = false;
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; showInstall("prompt"); });
window.addEventListener("appinstalled", () => { $("install").hidden = true; lsSet("registro-install-no", "1"); });
$("installGo").onclick = async () => {
  if($("install").dataset.mode==="prompt" && installEvt){
    installEvt.prompt();
    const r = await installEvt.userChoice.catch(() => null);
    installEvt = null;
    if(r && r.outcome==="accepted") lsSet("registro-install-no", "1");
  } else lsSet("registro-install-no", "1");
  $("install").hidden = true;
};
$("installLater").onclick = () => { $("install").hidden = true; };
if("serviceWorker" in navigator && window.isSecureContext && location.protocol!=="file:" && !framed){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
/* aperta come file dal computer: Chrome non propone l'installazione da solo, mostro come fare */
let unlocked = false;
if(location.protocol==="file:" && !framed) setTimeout(function wait(){ if(!unlocked) return setTimeout(wait, 800); if(!installEvt) showInstall("hint"); }, 1200);

/* vista settimanale ricordata su questo dispositivo */
if(lsGet(SPAN_KEY)==="week"){ state.span = "week"; state.wk = mondayOf(toKey(now)); syncMonth(); }

/* ---------- Accesso e salvataggio online (Firebase) ---------- */
/* ogni persona di ogni categoria è un documento a sé in "registro":
   così due persone che modificano cose diverse non si sovrascrivono */
const FB_CONFIG = {
  apiKey: "AIzaSyDMYAaA1jfACrmE0GPyqxL0C4NfYQbNNyc",
  authDomain: "martur-maintenance.firebaseapp.com",
  projectId: "martur-maintenance",
  storageBucket: "martur-maintenance.firebasestorage.app",
  messagingSenderId: "531327492011",
  appId: "1:531327492011:web:dc584f67030e6e99153cee"
};
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
$("lockLogo").innerHTML = document.querySelector(".brand").innerHTML;
function lockMsg(t){ $("lockErr").textContent = t; $("lockErr").hidden = !t; }
(async () => {
  let A, F;
  try{
    const [appM, authM, fsM] = await Promise.all([import(FB+"firebase-app.js"), import(FB+"firebase-auth.js"), import(FB+"firebase-firestore.js")]);
    A = authM; F = fsM;
    const app = appM.initializeApp(FB_CONFIG);
    var auth = A.getAuth(app);
    var db;
    try{ db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
    catch(e){ db = F.getFirestore(app); }
  }catch(e){
    lockMsg("Serve internet per il primo accesso. Controlla la connessione e ricarica la pagina.");
    $("lockGo").textContent = "Entra";
    return;
  }
  const col = F.collection(db, "registro");
  const docId = (cat, person) => encodeURIComponent(cat + "|" + person);
  const synced = {};        /* id → ultimo contenuto uguale tra app e server */
  let unsub = null, firstServer = true, timer = null;

  function buckets(){
    const out = {};
    for(const cat of Object.keys(data)){
      const c = data[cat];
      if(!c || typeof c!=="object") continue;
      for(const person of Object.keys(c)) out[docId(cat, person)] = {cat, person, json: JSON.stringify(c[person] || {})};
    }
    return out;
  }
  function push(){
    timer = null;
    if(!auth.currentUser) return;
    if(firstServer){ timer = setTimeout(push, 1000); return; }   /* aspetto i dati del server prima di scrivere */
    const now = buckets(), by = auth.currentUser.email || "";
    const writes = [];
    for(const [id, b] of Object.entries(now)) if(synced[id] !== b.json) writes.push([id, b]);
    /* persona svuotata o tolta (annulla, backup caricato): la svuoto anche online */
    for(const id of Object.keys(synced)) if(!now[id] && synced[id] !== "{}"){
      const [cat, person] = decodeURIComponent(id).split("|");
      writes.push([id, {cat, person, json:"{}"}]);
    }
    for(const [id, b] of writes){
      synced[id] = b.json;
      F.setDoc(F.doc(col, id), {cat:b.cat, person:b.person, json:b.json, by, at:F.serverTimestamp()})
        .catch(e => alertMsg("Non riesco a salvare online: " + (e.code === "permission-denied" ? "permesso negato." : "riprova tra poco.")));
    }
  }
  window.cloudSave = () => { if(auth.currentUser && !timer) timer = setTimeout(push, 400); };

  function listen(){
    firstServer = true;
    unsub = F.onSnapshot(col, {includeMetadataChanges: true}, snap => {
      let changed = false;
      for(const ch of snap.docChanges()){
        if(ch.type === "removed" || ch.doc.metadata.hasPendingWrites) continue;
        const d = ch.doc.data(), id = ch.doc.id;
        if(synced[id] === d.json) continue;
        if(timer && buckets()[id] && buckets()[id].json !== synced[id]) continue;   /* modifica locale in arrivo: vince quella */
        synced[id] = d.json;
        let v = {}; try{ v = JSON.parse(d.json); }catch(e){}
        data[d.cat] ??= {};
        data[d.cat][d.person] = v;
        changed = true;
      }
      if(firstServer && !snap.metadata.fromCache){
        firstServer = false;
        /* primo collegamento: ora carico online quello che c'è solo su questo computer */
        window.cloudSave();
      }
      if(changed){
        data = migrate(data);
        try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
        if(!painting) render();
      }
    }, e => alertMsg("Collegamento al server perso: " + (e.code === "permission-denied" ? "permesso negato." : "riprova tra poco.")));
  }

  A.onAuthStateChanged(auth, user => {
    $("lockGo").disabled = false;
    $("lockGo").textContent = "Entra";
    if(user){
      unlocked = true;
      lockMsg("");
      $("lockPw").value = "";
      document.body.classList.remove("locked");
      if(!unsub) listen();
      render();
    } else {
      unlocked = false;
      if(unsub){ unsub(); unsub = null; }
      document.body.classList.add("locked");
      setTimeout(() => ($("lockEmail").value ? $("lockPw") : $("lockEmail")).focus(), 50);
    }
  });
  $("lockForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("lockGo").disabled = true;
    lockMsg("");
    try{ await A.signInWithEmailAndPassword(auth, $("lockEmail").value.trim(), $("lockPw").value); }
    catch(err){
      lockMsg(err.code === "auth/network-request-failed" ? "Niente internet: serve la connessione per entrare." :
              err.code === "auth/too-many-requests" ? "Troppi tentativi sbagliati. Riprova tra qualche minuto." :
              "Email o password sbagliata, riprova.");
      $("lockPw").select();
    }
    $("lockGo").disabled = false;
  });
  window.cloudLogout = () => { if(timer){ clearTimeout(timer); push(); } A.signOut(auth); };
})();
</script>
