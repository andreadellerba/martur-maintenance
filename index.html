<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestione presenze manutenzione</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08090B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090B; --surface:#111317; --surface-2:#16191E; --surface-3:#252930; --line:#1C1F25; --line-2:#272B33;
  --text:#EDEFF2; --muted:#8A919D; --muted-2:#A8AFBA;
  --weekend:#FF3B4E; --weekend-ink:#FF8A95; --weekend-bg:#5C1424; --weekend-line:#A3233A;
  --s1:#1EB4FF; --s2:#00E08A; --sc:#FFC400; --s1l:#1EB4FF; --s2l:#00E08A; --sm:#9FB0C8; --c-turn:#B4C4FF;
  --c-pres:#00E676; --c-stra:#FFDD00; --c-ferie:#3D8BFF; --c-par:#00D0FF; --c-mal:#FF4545; --c-cigo:#D9822B; --c-vis:#14F0C8; --c-men:#FF9100;
  --on-fill:#08090B; --on-accent:#08090B;
  --today:#4ADE80; --faint:#6B717C; --btn-text:#CDD2DA; --cell-line:#17191E; --hover-line:#4A505B; --backdrop:rgba(0,0,0,.6);
  --accent:var(--c-pres);
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
/* tema chiaro: colori scuri per il testo, riempimenti dei turni invariati (testo scuro sopra) */
:root[data-theme="light"]{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF2; --surface-3:#D5DBE3; --line:#DDE2E9; --line-2:#C9D0DA;
  --text:#14171C; --muted:#56606E; --muted-2:#3E4652;
  --weekend:#E0102F; --weekend-ink:#C00020; --weekend-bg:#FFD3DA; --weekend-line:#F28A9B;
  --sm:#94A3B8; --c-turn:#4338CA;
  --c-pres:#00894A; --c-stra:#B37A00; --c-ferie:#1456F0; --c-par:#0086B3; --c-mal:#D90429; --c-cigo:#7A4A1E; --c-vis:#00806E; --c-men:#E65100;
  --on-accent:#FFFFFF;
  --today:#15803D; --faint:#646D7A; --btn-text:#2F3640; --cell-line:#DDE2E9; --hover-line:#8E97A4; --backdrop:rgba(20,23,28,.45);
  color-scheme:light;
}
body[data-cat="presenze"]{--accent:var(--c-pres)}
body[data-cat="straordinario"]{--accent:var(--c-stra)}
body[data-cat="ferie"]{--accent:var(--c-ferie)}
body[data-cat="malattia"]{--accent:var(--c-mal)}
body[data-cat="cigo"]{--accent:var(--c-cigo)}
body[data-cat="turnazione"]{--accent:var(--c-turn)}
body[data-cat="report"]{--accent:var(--text)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.35}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* testata */
.hdr{height:64px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{justify-self:start;display:flex;align-items:center;min-width:0;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.pills{grid-column:2;justify-self:center;display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:999px}
.pill{border:0;border-radius:999px;padding:9px 11px;font-size:13px;letter-spacing:.02em;font-weight:600;background:transparent;color:var(--muted-2);cursor:pointer;white-space:nowrap}
.pill:hover{color:var(--text)}
.pill[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.hdr-r{grid-column:3;justify-self:end;display:flex;justify-content:flex-end;gap:8px}
.btn-o{white-space:nowrap;height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px;background:transparent;color:var(--btn-text);font-size:13px;font-weight:600;cursor:pointer}
.btn-o:hover{background:var(--surface-2)}
.btn-o[disabled]{opacity:.4;cursor:default}
.xls{white-space:nowrap;height:36px;padding:0 16px;border:0;border-radius:10px;background:var(--text);color:var(--bg);font-size:13px;font-weight:700;cursor:pointer}
.xls[disabled]{opacity:.6}

/* barra mese + turni */
.sub{min-height:68px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px 28px;padding:8px 16px}
#subbar #shiftbar,#subbar .sub-r{display:none!important}
.mnav{display:flex;align-items:center;gap:10px}
.mnav .arr{width:32px;height:32px;border:1px solid var(--line-2);border-radius:8px;background:transparent;font-size:16px;cursor:pointer}
.mnav .arr:hover{background:var(--surface-2)}
.month{font-family:var(--display);font-size:26px;font-weight:700;margin:0;min-width:160px;text-align:center;white-space:nowrap}
.today{height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:transparent;font-size:13px;color:var(--muted-2);cursor:pointer}
select.today,.jump{background:var(--surface);color:var(--text);font:inherit;font-size:13px;font-weight:600;color-scheme:dark}
:root[data-theme="light"] select.today,:root[data-theme="light"] .jump{color-scheme:light}
.jump{padding:0 8px}
.palette{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.palette.off{visibility:hidden}
.chip{--chipc:var(--sm);height:38px;padding:0 10px;border-radius:10px;display:flex;align-items:center;gap:8px;cursor:grab;background:var(--surface);border:1px solid var(--line-2)}
.chip .sw{width:14px;height:14px;border-radius:4px;background:var(--chipc)}
.chip b{font-size:14px;font-variant-numeric:tabular-nums}
.chip kbd{font-family:var(--body);font-size:11px;color:var(--faint);font-weight:600}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--chipc) 18%,var(--surface));border:1.5px solid var(--chipc)}
.chip.erase{--chipc:var(--weekend);color:var(--weekend)}
.chip.erase .sw{background:transparent;border:2px solid var(--weekend)}
.chip.dragging{opacity:.5}
.act.dragging{opacity:.5}
.act[draggable]{cursor:grab}
.sub-r{display:flex;justify-content:flex-end;gap:8px}
.fill{height:32px;padding:0 12px;border:1px dashed var(--hover-line);border-radius:8px;background:transparent;color:var(--btn-text);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.fill:hover:not([disabled]){border-style:solid}
.fill[disabled]{opacity:.45;cursor:default}

/* matrice del reparto */
.board{padding:0 16px;overflow-x:auto}
.matrix{min-width:980px;display:flex;flex-direction:column;gap:4px}
.row{display:grid;grid-template-columns:var(--cols);gap:3px}
.wkl{text-align:center;font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted-2);padding:2px 0 3px;border-bottom:2px solid var(--line-2);white-space:nowrap;overflow:hidden}
.head{height:58px}
.hname,.fname{display:flex;align-items:flex-end;padding:0 0 6px 6px;font-size:12px;color:var(--faint);font-weight:600}
.fname{align-items:center;padding:0 0 0 6px;font-size:13px;font-weight:700;color:var(--muted-2)}
.dh{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;border-radius:6px;color:var(--muted-2);line-height:1.05}
.dh span{font-size:10px;font-weight:600;opacity:.8}
.dh b{font-family:var(--display);font-size:17px}
.dh.nar span{font-size:9px}
.dh.nar em{padding:0 3px}
.matrix .cell.nar .fest::before{content:"F"}
.cell.nar .fest{padding:1px 3px}
.cell.nar.lg .hn{display:none}
.cell.nar.lg.hol::after{content:"F";position:absolute;top:32px;left:50%;transform:translateX(-50%);font-family:var(--body);font-size:11px;font-weight:800;padding:1px 5px;border-radius:3px;background:var(--weekend);color:var(--bg)}
.cell.nar.lg .dn{left:50%;transform:translateX(-50%)}
.dh.we{color:var(--weekend-ink);background:var(--weekend-bg)}
.dh em{font-style:normal;font-size:8px;font-weight:800;letter-spacing:.02em;padding:0 2px;margin-bottom:2px;border-radius:3px;background:var(--weekend);color:var(--bg)}
.cell .fest{font-family:var(--body);font-size:7.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap;max-width:100%;overflow:hidden;padding:1px 2px;margin-bottom:2px;border-radius:3px;background:var(--weekend);color:var(--bg)}
.cell:not(.lg) .fest::before{content:"FEST"}
@media (max-width:1100px){.cell:not(.lg) .fest::before{content:"F"}}
.cell.shift .fest{background:var(--on-fill);color:var(--ac)}
.cell.lg.hol{padding-top:20px}
.cell.val .fest,.cell.abs .fest{background:var(--ac);color:var(--on-fill)}
.cell.lg .hn{position:absolute;top:7px;right:8px;max-width:calc(100% - 36px);margin:0;font-size:10px;padding:2px 5px;text-overflow:ellipsis}
.dh.now{color:var(--today);background:color-mix(in srgb,var(--today) 14%,transparent);box-shadow:inset 0 -3px 0 var(--today)}
.dh.now span{opacity:1}
.dh.now.we{color:var(--weekend-ink);background:var(--weekend-bg);box-shadow:inset 0 -3px 0 var(--weekend)}
.cell.now.we{box-shadow:inset 0 3px 0 var(--weekend)}
.cell.now{box-shadow:inset 0 3px 0 var(--today)}
.th{white-space:nowrap;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;font-size:10px;font-weight:700;line-height:1.1;text-align:center}
.th small{font-size:9px;font-weight:500;color:var(--faint);white-space:nowrap}
.prow{min-height:88px;border-radius:10px}

.prow.on{background:var(--surface);outline:1px solid var(--line-2)}
.pname{display:flex;align-items:center;gap:10px;padding:0 2px 0 6px;border:0;background:transparent;text-align:left;cursor:pointer;min-width:0;border-radius:10px}
.pname:hover .pn b{text-decoration:underline}
.av{width:34px;height:34px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-3);color:var(--text)}
.prow.on .pn b{color:var(--weekend)}
.pn{display:flex;flex-direction:column;gap:1px;min-width:0}
.pn b{font-size:12.5px;line-height:1.15;white-space:nowrap;text-transform:uppercase}
.pn small{font-size:11px;font-weight:600;color:var(--muted);line-height:1.3;white-space:nowrap;text-transform:uppercase}
.pn .pmore{font-size:10.5px;font-weight:600;line-height:1.2}
.cell{position:relative;border-radius:6px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;min-width:0;font-family:var(--display);line-height:1;background:var(--surface);border:1px solid var(--cell-line);color:var(--text);user-select:none;overflow:hidden}
.cell:hover{border-color:var(--hover-line)}
.cell.we{background:var(--weekend-bg);border-color:var(--weekend-line)}
.cell .t1{font-size:14px;font-weight:700}
.cell .t2{font-size:14px;font-weight:700;opacity:.72}
.cell .sm{font-size:10px;letter-spacing:-.03em}
.cell .ap{font-family:var(--body);font-size:8px;font-weight:800;letter-spacing:.02em;padding:0 2px;border-radius:3px;background:var(--ac);color:var(--on-fill)}
.cell.lg .ap{font-size:11px;padding:1px 4px}
.cell .big{font-size:18px;letter-spacing:-.02em}
.cell .xs{font-size:8px;letter-spacing:.02em;opacity:.8}
.cell .man{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--text);box-shadow:0 0 0 2px var(--bg)}
.cell.shift{background:var(--ac);border-color:transparent;color:var(--on-fill)}
.cell .stk{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);line-height:1;text-transform:uppercase;text-align:center}
.cell .stk b{font-size:11px;font-weight:700;white-space:nowrap}
.cell .stk b.n{font-size:17px;font-weight:800}
.cell .stk b.m{font-size:11.5px;font-weight:800}
.cell.lg .stk b,.wkv .cell .stk b{font-size:14px}
.cell.lg .stk b.n,.wkv .cell .stk b.n{font-size:24px}
.cell.lg .stk b.m,.wkv .cell .stk b.m{font-size:16px}
.cell.holfill{background:var(--weekend);border-color:var(--weekend)}
.cell .hf{font-family:var(--display);font-size:22px;font-weight:800;line-height:1;color:var(--on-fill)}
.cell.lg .hf,.wkv .cell .hf{font-size:34px}
.cell.holfill .hn{background:transparent;color:var(--on-fill)}
.cell.nar.lg.hol::after{display:none}
.dh.hol,.dh.hol.now{background:var(--weekend);color:var(--on-fill);box-shadow:none}
.dh.hol span{opacity:1}
.cell.holfill .dn{color:var(--on-fill)!important}
.cell .missc{position:absolute;top:3px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--weekend);border:2px solid #000;box-sizing:border-box;z-index:1}
.cell.lg .missc{width:13px;height:13px;top:6px}
.cell.tfx{justify-content:flex-start;overflow:hidden;gap:0}
.cell.tfx .tm{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cell.tfx .tm b{font-family:var(--display);font-size:14px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.cell.tfx .sep{width:14px;height:1.5px;background:currentColor;opacity:.45}
.cell.tfx .band{width:100%;display:flex;flex-direction:column;background:var(--on-fill)}
.cell.tfx .bx{font-family:var(--display);font-size:11px;font-weight:700;line-height:1;color:var(--mc);text-align:center;padding:3px 0;white-space:nowrap;border-top:1px solid var(--surface-2)}
.cell.tfx .bx:first-child{border-top:0}
.cell.tfx .fest{margin:3px 0 0}
@media (max-width:1300px){.cell.tfx .tm b{font-size:12px}.cell.tfx .bx{font-size:10px}}
.cell.lg.tfx .tm b,.wkv .cell.tfx .tm b{font-size:19px}
.cell.lg.tfx .sep,.wkv .cell.tfx .sep{width:22px;height:2px}
.cell.lg.tfx .bx,.wkv .cell.tfx .bx{font-size:12.5px;padding:3px 0}
.cell.abs{background:transparent;border:1.5px solid var(--ac);color:var(--ac)}
.cell.abs .t1{font-size:11px}
.cell.abs .t2{font-size:11px;font-weight:600}
.cell.val{background:color-mix(in srgb,var(--ac) 22%,var(--surface));border-color:color-mix(in srgb,var(--ac) 55%,transparent);color:var(--ac)}
.cell .ot{font-family:var(--body);font-size:9.5px;letter-spacing:-.03em;white-space:nowrap;max-width:100%;font-weight:700;margin-top:3px;padding:1px 2px;border-radius:4px;background:var(--bg);color:var(--c-stra)}
.cell .mk{font-family:var(--body);font-size:9px;letter-spacing:-.03em;white-space:nowrap;max-width:100%;font-weight:700;margin-top:3px;padding:1px 2px;border-radius:4px;background:var(--bg);color:var(--mc)}
.cell .star{position:absolute;top:0;left:3px;font-family:var(--body);font-size:15px;font-weight:900;line-height:1;color:var(--text)}
.cell.shift .star{color:var(--on-fill)}
.cell.val .star,.cell.abs .star{color:var(--ac)}
.cell.lg .star{top:auto;left:auto;bottom:6px;right:9px;font-size:20px}
.cell .miss{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--weekend);box-shadow:0 0 0 2px var(--bg)}
.cell.rng{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.cell.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text);z-index:1}
.cell.drop-over{outline:3px dashed var(--drop,var(--accent));outline-offset:-3px}
.tc{min-width:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;background:var(--surface);font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.tc.month{background:color-mix(in srgb,currentColor 12%,var(--surface))}
.tc .fp{font-size:9.5px}
.foot{height:40px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.fd{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tc.total{background:transparent;font-size:12px}

/* dettaglio del giorno */
.detail{margin:0 16px 12px;display:flex;align-items:center;justify-content:flex-start;gap:16px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.avatar{--ac:var(--line-2);width:80px;height:80px;flex-shrink:0;border-radius:14px;border:3px solid var(--ac);background:var(--surface-2);color:var(--muted-2);padding:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);cursor:pointer}
.avatar span{font-size:26px;font-weight:700;line-height:1}
.avatar small{font-family:var(--body);font-size:10px;font-weight:600;color:var(--faint)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.empty,.avatar.multi{cursor:default}
.avatar.multi span{color:var(--ac)}
.dbody{flex:1;min-width:0;min-height:80px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.dline{display:flex;align-items:baseline;gap:14px;white-space:nowrap;overflow:hidden;min-width:0}
.dline b{font-size:16px;font-family:var(--display);letter-spacing:.02em;flex-shrink:0}
.dline span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.dhol{font-style:normal;font-family:var(--body);font-size:11px;font-weight:800;padding:1px 6px;border-radius:4px;background:var(--weekend);color:var(--bg);margin-left:6px}
.dnum{--ac:var(--surface-3);width:44px;height:44px;border-radius:10px;background:var(--ac);color:var(--on-fill);display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:700;flex-shrink:0}
.dnum.empty{color:var(--muted)}
.dtxt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 280px}
.dtxt b{font-size:15px}
.dtxt small{font-size:13px;color:var(--muted)}
.dact{display:flex;gap:6px;flex-wrap:wrap}
.xbtn{font-size:16px;font-weight:700;padding:0 13px}
.act{--ac:var(--btn-text);height:36px;padding:0 10px;white-space:nowrap;border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);border-radius:10px;background:transparent;color:var(--ac);font-size:13px;font-weight:600;cursor:pointer}
.act:hover{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.act.clear{--ac:var(--weekend)}
.hint{margin:12px 24px 24px;text-align:center;color:var(--faint);font-size:13px}
.msg{text-align:center;color:var(--weekend);font-weight:600;margin:6px 0 0}

/* finestre */
dialog{border:1px solid var(--line-2);border-radius:14px;background:var(--surface);color:var(--text);padding:22px;width:min(360px,calc(100% - 32px))}
dialog::backdrop{background:var(--backdrop)}
dialog h2{font-family:var(--display);font-size:30px;font-weight:700;margin:0 0 4px}
dialog p{margin:0 0 14px;color:var(--muted);font-size:14px}
dialog input{width:100%;font:inherit;font-size:22px;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);color:var(--text)}
.dlg-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.notelab{display:block;margin:12px 0 4px;font-size:13px;font-weight:600;color:var(--muted-2)}
.notelab small{font-weight:500;color:var(--muted)}
dialog textarea{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);color:var(--text);resize:vertical}
.tip{position:fixed;z-index:60;max-width:260px;padding:8px 10px;border-radius:8px;background:var(--text);color:var(--bg);font-size:13px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;white-space:pre-wrap}
.tip b{display:block;font-size:11px;opacity:.7;margin-bottom:2px}
.tip br{display:block;content:"";margin-top:6px}
.btn{border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{margin-right:auto;background:none;color:var(--weekend);border-color:transparent}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{flex:1;padding:8px 0;border:1px solid var(--line-2);border-radius:8px;background:none;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.chips .restchip{flex-basis:100%;border-style:dashed;color:var(--accent)}
.trow{display:flex;gap:8px;margin-bottom:6px}
.trow label{flex:1;font-size:13px;color:var(--muted)}
.trow input{margin-top:4px;font-size:20px}
.calc{font-size:14px;color:var(--muted);margin:6px 0 0}
.calc strong{color:var(--text)}
.restlab{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
.restlab input{margin-top:4px}
.restbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.restbtns .btn{padding:12px;font-size:16px;background:transparent}
.restbtns [data-c="f"]{border-color:var(--c-ferie);color:var(--c-ferie)}
.restbtns [data-c="p"]{border-color:var(--c-par);color:var(--c-par)}
.restbtns [data-c="cigo"]{border-color:var(--c-cigo);color:var(--c-cigo)}
.restbtns [data-c="malattia"]{border-color:var(--c-mal);color:var(--c-mal)}
.restbtns [data-c="visita"]{border-color:var(--c-vis);color:var(--c-vis)}
.restbtns [data-c="mensa"]{border-color:var(--c-men);color:var(--c-men)}
.restbtns .btn[disabled]{opacity:.3;cursor:default}
#yearBtn,#cigBtn{font-size:13px}
#cigRow{margin-top:10px}
#cigBtn[aria-pressed="true"]{background:var(--c-cigo);border-color:var(--c-cigo);color:var(--on-accent)}

/* password */
body.locked>*:not(.lock){display:none!important}
.lock{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);padding:16px;z-index:50}
body:not(.locked) .lock{display:none}
.lock-box{width:min(360px,100%);display:flex;flex-direction:column;gap:12px;padding:28px;border:1px solid var(--line-2);border-radius:16px;background:var(--surface)}
.lock-logo{display:flex;justify-content:center;margin-bottom:8px}
.lock-logo .logo{height:22px}
.lock-box label{font-size:14px;font-weight:600;color:var(--muted-2)}
.lock-box input{font:inherit;font-size:18px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);color:var(--text)}
.lock-err{margin:0;color:var(--weekend);font-weight:600;font-size:13px}
.lock-go[disabled]{opacity:.5;cursor:default}
.lock-go{height:44px;border:0;border-radius:10px;background:var(--c-pres);color:var(--on-accent);font-size:15px;font-weight:700;cursor:pointer}
/* logo */
.logo{height:20px;width:auto;display:block;max-width:100%}
.logo-l{display:none}
:root[data-theme="light"] .logo-d{display:none}
:root[data-theme="light"] .logo-l{display:block}
@media (max-width:1360px){.logo{height:15px}.hdr-r .lbl{display:none}.pill{padding:8px 9px;font-size:12px}.hdr{gap:8px}}
/* vista */
.viewbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.vb-l{font-size:12px;font-weight:700;color:var(--faint);margin-right:4px;letter-spacing:.04em;text-transform:uppercase}
.vb{height:30px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;background:transparent;color:var(--btn-text);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.vb:hover{background:var(--surface-2)}
.vb[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.matrix.one{min-width:0;max-width:1100px;margin:0 auto;gap:12px}
.s-head{display:flex;align-items:center;gap:12px}
.s-head .av{width:40px;height:40px;background:var(--accent);color:var(--on-accent)}
.s-head b{display:block;font-size:17px}
.s-head small{color:var(--muted);font-size:13px}
.single{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 110px;gap:6px}
.s-wd{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted-2);text-align:center;padding-bottom:2px}
.s-wd.we{color:var(--weekend)}
.s-empty{min-height:92px}
.cell.lg{min-height:92px;border-radius:10px;gap:3px}
.wkv .cell .t1{font-size:22px}
.wkv .cell .t2{font-size:18px}
.wkv .cell .sm{font-size:15px;letter-spacing:0}
.wkv .cell .big{font-size:30px}
.wkv .cell .mk,.wkv .cell .ot{font-size:12px}
.wkv .cell .fest{font-size:10px;padding:1px 5px}
.wkv .cell .star{font-size:20px;left:6px;top:2px}
.cell.lg .dn{position:absolute;top:6px;left:8px;font-family:var(--display);font-size:16px;font-weight:700;opacity:.85}
.cell.lg.we .dn{color:var(--weekend-ink)}
.cell.lg.shift .dn{color:inherit}
.cell.lg .t1{font-size:22px}
.cell.lg .t2{font-size:18px}
.cell.lg .sm{font-size:15px;letter-spacing:0}
.cell.lg .big{font-size:30px}
.cell.lg .ot{font-size:12px;margin-top:4px}
.cell.lg .mk{font-size:11px}
.cell.lg .miss{width:9px;height:9px;top:8px;right:8px}
.s-wk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;background:var(--surface);border:1px dashed var(--line-2);color:var(--accent);text-align:center;padding:4px}
.s-wk b{font-size:16px}
.s-wk .wn{font-size:11px;font-weight:700;color:var(--muted-2);letter-spacing:.04em}
.s-wk small{font-size:11px;color:var(--muted);font-weight:600}
.s-tots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.s-tot{display:flex;flex-direction:column;align-items:center;min-width:86px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.s-tot small{font-size:11px;font-weight:700;letter-spacing:.04em}
.s-tot b{font-size:20px;font-variant-numeric:tabular-nums}
/* tema */
.btn-o.icon{display:inline-flex;align-items:center;justify-content:center;width:36px;padding:0}
/* report */
.report{padding:8px 24px 0;display:flex;flex-direction:column;gap:14px}
.rp-bar,.rp-bar2{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.rp-dates{display:flex;gap:10px}
.rp-dates label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted-2)}
.rp-dates input{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--text)}
.rp-pre,.seg2{display:flex;flex-wrap:wrap;gap:6px}
.rp-chip{height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;background:transparent;color:var(--btn-text);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.rp-chip:hover{background:var(--surface-2)}
.rp-chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.rp-h{font-family:var(--display);font-size:24px;font-weight:700;margin:6px 0 0}
.rp-bar2 .rp-h{margin:0;margin-right:auto}
.rp-note{margin:-8px 0 0;font-size:13px;color:var(--muted)}
.rp-empty{color:var(--weekend);font-weight:600}
.rp-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rp{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.rp th,.rp td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.rp thead th{font-size:12px;font-weight:700;color:var(--muted-2);background:var(--surface-2);position:sticky;top:0}
.rp .l{text-align:left;font-weight:700;color:var(--text)}
.rp .l small{font-weight:500;color:var(--muted);margin-left:6px}
.rp tbody tr:last-child>*{border-bottom:0}
.rp tbody tr:hover{background:color-mix(in srgb,var(--text) 4%,transparent)}
.rp .tot{font-weight:700}
.rp tr.sum>*{font-weight:700;background:var(--surface-2)}
.rp .zero{color:var(--faint)}
.rp .c-pres{color:var(--c-pres)} .rp .c-stra{color:var(--c-stra)} .rp .c-ferie{color:var(--c-ferie)} .rp .c-par{color:var(--c-par)} .rp .c-mal{color:var(--c-mal)} .rp .c-cigo{color:var(--c-cigo)} .rp .c-vis{color:var(--c-vis)} .rp .c-men{color:var(--c-men)}
.rp th.sh{color:var(--muted-2)} .rp td.sh{color:var(--text)}
.rp th.sh:first-of-type,.rp td.sh{border-left:0}
.swd{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--sw);margin-right:5px;vertical-align:0}
.rp-card{display:flex;flex-direction:column;gap:8px}
.rp-card h3{display:flex;align-items:center;gap:10px;margin:6px 0 0;font-size:16px;font-weight:500;flex-wrap:wrap}
.rp-card h3 small{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.rp-data{margin-top:8px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;border:1px dashed var(--line-2);border-radius:12px}
.rp-data>span:first-child{display:flex;flex-direction:column;gap:2px;flex:1 1 300px}
.rp-data small{color:var(--muted);font-size:13px}
.rp-dact{display:flex;gap:8px}
/* banner installazione */
.install{position:fixed;right:20px;bottom:20px;z-index:20;width:min(460px,calc(100% - 40px));display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.inst-ic{width:40px;height:40px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;background:var(--c-pres);color:var(--on-accent)}
.inst-txt{display:flex;flex-direction:column;gap:4px;flex:1}
.inst-txt b{font-size:15px}
.inst-txt small{font-size:13px;color:var(--muted);line-height:1.4}
.inst-act{display:flex;flex-direction:column;gap:6px}

@media (max-width:1080px){
  .hdr{grid-template-columns:1fr;height:auto;padding:10px 12px;gap:8px;justify-items:center}
  .brand,.pills,.hdr-r{grid-column:1;justify-self:center}
}
@media (max-width:900px){
  .hdr{grid-template-columns:1fr;height:auto;padding:10px 12px;gap:8px;justify-items:center}
  .brand,.pills,.hdr-r{grid-column:1;justify-self:center}
  .pills{overflow-x:auto;max-width:100%}
  .pill{padding:8px 12px}
  .sub{grid-template-columns:1fr;justify-items:center;padding:8px 12px}
  .board{padding:0 12px}
  .detail{margin:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const CATS = [
  {id:"presenze", label:"PRESENZE", hint:"Clicca una casella o trascina col mouse su più giorni e persone, poi scegli il turno o la voce nella barra qui sopra. Tasti: 1–5 turni, 6 orario manuale, 0 svuota, Esc deseleziona, Ctrl+Z annulla."},
  {id:"turnazione", label:"TURNAZIONE", hint:"Turni previsti dalla rotazione settimanale (da lunedì 28 settembre 2026). Per cambiarli seleziona le caselle e scegli il turno nella barra qui sopra (tasti 1, 2, 3, 0 per svuotare). Con Copia nelle presenze li riporti nel calendario vero."},
  {id:"straordinario", label:"STRAORDINARIO", hint:"Lo straordinario dei turni si calcola da solo dalle presenze. Clicca una casella o trascina su più giorni per aggiungere ore in più a mano. A destra i totali per settimana e per mese."},
  {id:"ferie", label:"FERIE / PAR", hint:"Si compila da sola quando assegni le ore mancanti di una giornata. Clicca una casella o trascina su più giorni per inserire o correggere a mano."},
  {id:"malattia", label:"MALATTIA", hint:"Clicca una casella o trascina su più giorni, poi scegli le ore (8 h = giornata intera)."},
  {id:"cigo", label:"CIGO", hint:"Si compila da sola quando assegni le ore mancanti di una giornata. Clicca una casella o trascina su più giorni per inserire o correggere a mano."},
  {id:"report", label:"REPORT", hint:"Scegli le date o un periodo rapido. I conti usano gli stessi dati di presenze, straordinario, ferie, PAR, malattia e CIGO."}
];
const HOURCATS = ["straordinario","ferie","malattia","cigo"];
const DAY_H = 8;
/* ot = straordinario automatico in ore */
const SHIFTS = {
  "1":  {label:"1° turno",           time:"06-14",    dur:8,   ot:0,   key:"1", color:"--s1",  hex:"0284C7"},
  "2":  {label:"2° turno",           time:"14-22",    dur:8,   ot:0,   key:"2", color:"--s2",  hex:"059669"},
  "C":  {label:"Centrale",           time:"07-15",    dur:8,   ot:0,   key:"3", color:"--sc",  hex:"B45309"},
  "1L": {label:"1° turno + 30 min",  time:"05:30-14", dur:8.5, ot:0.5, key:"4", color:"--s1l", hex:"0284C7"},
  "2L": {label:"2° turno + 30 min",  time:"14-22:30", dur:8.5, ot:0.5, key:"5", color:"--s2l", hex:"059669"},
  "M":  {label:"Manuale",            time:"Manuale",  dur:0,   ot:0,   key:"6", color:"--sm",  hex:"475569"}
};
/* finestre dei turni normali, in minuti: oltre queste è straordinario */
const STD = [[360,840],[840,1320],[420,900]];
/* in ordine alfabetico per cognome */
const PEOPLE = ["VINCENZO GENCO","ERMINIO SICILIA","MASSIMILIANO TORRENTE","FRANCESCO SERRA","FABRIZIO COPERTINO"]
  .sort((a,b) => a.split(" ").slice(-1)[0].localeCompare(b.split(" ").slice(-1)[0]));
const RENAMED = {"MASSIMO TORRENTE":"MASSIMILIANO TORRENTE"};
const MONTHS = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const WD = ["LUN","MAR","MER","GIO","VEN","SAB","DOM"];
const KEY = "registro-reparto-v1";

const now = new Date();
const state = {cat:"presenze", person:PEOPLE[0], y:now.getFullYear(), m:now.getMonth(), brush:null, sel:null, view:null, span:"month", wk:null};
let data = migrate(load());
const undoStack = [];
let lastTimes = {s:"06:00", e:"14:00"};

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
/* porta i dati delle versioni precedenti al formato in ore */
function migrate(d){
  /* nomi cambiati: sposta i dati sul nuovo nome */
  for(const cat of Object.keys(d)){
    for(const [oldN,newN] of Object.entries(RENAMED)){
      if(d[cat] && d[cat][oldN]){ d[cat][newN] = Object.assign({}, d[cat][newN]||{}, d[cat][oldN]); delete d[cat][oldN]; }
    }
  }
  for(const p of Object.keys(d.ferie||{})){
    const b = d.ferie[p];
    for(const k of Object.keys(b)){
      const v = b[k];
      if(v && typeof v==="object" && ("f" in v || "p" in v)) continue;
      if(v && typeof v==="object") b[k] = v.t==="PAR" ? {f:0,p:v.h} : {f:v.h,p:0};
      else b[k] = v==="PAR" ? {f:0,p:8} : {f:8,p:0};
    }
  }
  for(const p of Object.keys(d.malattia||{})){
    const b = d.malattia[p];
    for(const k of Object.keys(b)) if(typeof b[k]!=="number" && !(b[k] && typeof b[k]==="object" && typeof b[k].h==="number")) b[k] = DAY_H;
  }
  return d;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
  if(window.cloudSave) window.cloudSave();
}
function bucket(cat, person){ data[cat] ??= {}; data[cat][person] ??= {}; return data[cat][person]; }
function get(cat, person, key){ return ((data[cat]||{})[person]||{})[key]; }

/* annulla */
function pushHistory(){ undoStack.push(JSON.stringify(data)); if(undoStack.length>100) undoStack.shift(); }
function commit(fn){ pushHistory(); fn(); save(); render(); }
function undo(){
  if(!undoStack.length) return;
  data = JSON.parse(undoStack.pop()); save(); render();
}

const pad = n => String(n).padStart(2,"0");
const iso = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const r2 = n => Math.round(n*100)/100;
const fmt = n => r2(n).toLocaleString("it-IT",{maximumFractionDigits:2});
const hm = t => t.replace(/^0(?=\d)/,"");
const mins = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const sid = v => v===true ? "P" : (typeof v==="object" ? v.t : v);
const tshort = t => t.endsWith(":00") ? t.slice(0,-3) : t;
/* orari sempre con i minuti: 7 -> 07:00, 5:30 -> 05:30 */
const hhmm = t => t.includes(":") ? t.padStart(5,"0") : t.padStart(2,"0") + ":00";
const fullRange = r => r.split("-").map(hhmm).join("-");
/* orario del turno, es. 05:30-14 */
function timeLabel(v){
  if(v===undefined) return "";
  const id = sid(v);
  if(id==="M") return `${hhmm(v.s)}-${hhmm(v.e)}`;
  return SHIFTS[id] ? fullRange(SHIFTS[id].time) : "Presente";
}
/* assenza principale del giorno (quella con più ore) */
const ABS = [
  {key:"malattia", label:"Malattia",      short:"MAL",  mk:"M", color:"--c-mal",   hex:"DC2626", h:(p,k)=>malH(p,k)},
  {key:"f",        label:"Ferie",         short:"FER",  mk:"F", color:"--c-ferie", hex:"2563EB", h:(p,k)=>ferF(p,k)},
  {key:"p",        label:"PAR",           short:"PAR",  mk:"P", color:"--c-par",   hex:"0891B2", h:(p,k)=>ferP(p,k)},
  {key:"cigo",     label:"CIGO",          short:"CIGO", mk:"C", color:"--c-cigo",  hex:"8B5A2B", h:(p,k)=>cigH(p,k)},
  {key:"visita",   label:"Visita medica", short:"VIS",  mk:"V", color:"--c-vis",   hex:"0D9488", h:(p,k)=>visH(p,k)},
  {key:"mensa",    label:"Pausa mensa",   short:"MEN",  mk:"MS", color:"--c-men",   hex:"EA580C", h:(p,k)=>menH(p,k)}
];
/* sigla e nome per esteso, con "anno precedente" per ferie e PAR */
function absAP(a,p,k){ return (a.key==="f" && ferA(p,k)) || (a.key==="p" && parA(p,k)) || (a.key==="malattia" && malE(p,k).a==="AP") ? "AP" : ""; }
function absShort(a,p,k){ return a.short + (absAP(a,p,k) ? " AP" : ""); }
function absName(a,p,k){
  const n = a.key==="p" || a.key==="cigo" ? a.label : a.label.toLowerCase();
  const e = get("ferie",p,k) || {}, cg = (a.key==="f" && e.fc) || (a.key==="p" && e.pc) || (a.key==="malattia" && malE(p,k).c) ? " (CIGO nel report)" : "";
  return (absAP(a,p,k) ? n + " AP" : n) + cg;
}
function absList(p,k){ return ABS.map(a => ({...a, hours:a.h(p,k)})).filter(a => a.hours>0).sort((a,b)=>b.hours-a.hours); }

/* turno manuale: durata e straordinario oltre il turno normale di riferimento */
function manualCalc(s, e){
  let a = mins(s), b = mins(e); if(b<=a) b += 1440;
  /* le ore inserite sono ore di lavoro: straordinario solo oltre le 8 ore */
  const dur = (b - a)/60, ot = Math.max(0, dur - DAY_H);
  return {dur, ot, worked: Math.min(DAY_H, dur)};
}

/* ore per giorno */
/* turno "grezzo" del giorno, prima delle assenze */
function baseCalc(p,k){
  const v = get("presenze",p,k);
  if(v===undefined) return {dur:0, ot:0, worked:0};
  const id = sid(v);
  const c = id==="M" ? manualCalc(v.s,v.e) : {dur: SHIFTS[id]?.dur || DAY_H, ot: SHIFTS[id]?.ot || 0, worked: DAY_H};
  /* sabato, domenica e festivi: tutte le ore sono straordinario */
  if(!isWorkday(k)) return {dur:c.dur, ot:c.dur, worked:0};
  return c;
}
/* ore di assenza (ferie, PAR, malattia, CIGO): prevalgono sul turno */
const absH    = (p,k) => ferF(p,k) + ferP(p,k) + malH(p,k) + cigH(p,k) + visH(p,k) + menH(p,k);
const worked  = (p,k) => Math.min(baseCalc(p,k).worked, Math.max(0, DAY_H - absH(p,k)));
const otAuto  = (p,k) => (isWorkday(k) && absH(p,k) >= DAY_H) ? 0 : baseCalc(p,k).ot;
const otExtra = (p,k) => Number(get("straordinario",p,k)) || 0;
const otDay   = (p,k) => otAuto(p,k) + otExtra(p,k);
const ferF    = (p,k) => get("ferie",p,k)?.f || 0;
const ferP    = (p,k) => get("ferie",p,k)?.p || 0;
/* ore dell'anno precedente: "AP" se segnate, altrimenti "" (anno corrente) */
const ferA    = (p,k) => ferF(p,k) && get("ferie",p,k)?.a==="AP" ? "AP" : "";
const parA    = (p,k) => ferP(p,k) && get("ferie",p,k)?.pa==="AP" ? "AP" : "";
const malE    = (p,k) => { const v = get("malattia",p,k); return v && typeof v==="object" ? v : {h: Number(v) || 0}; };   /* {h, a:"AP", c:conta come CIGO, n:commento} */
const malH    = (p,k) => Number(malE(p,k).h) || 0;
const cigH    = (p,k) => Number(get("cigo",p,k)) || 0;
const visH    = (p,k) => Number(get("visita",p,k)) || 0;
const menH    = (p,k) => Number(get("mensa",p,k)) || 0;
/* commento libero della casella (persona + giorno), visibile passando col mouse */
const noteOf  = (p,k) => { const n = get("note",p,k); return typeof n==="string" ? n : ""; };
const hasNote = (p,k) => !!(noteOf(p,k) || get("ferie",p,k)?.n || malE(p,k).n);
const covered = (p,k) => worked(p,k) + absH(p,k);
/* valore di una categoria in un giorno, in ore */
function hoursOf(cat,p,k){
  if(cat==="straordinario") return otDay(p,k);
  if(cat==="ferie") return ferF(p,k) + ferP(p,k);
  if(cat==="malattia") return malH(p,k);
  if(cat==="cigo") return cigH(p,k);
  if(cat==="visita") return visH(p,k);
  if(cat==="mensa") return menH(p,k);
  return worked(p,k);
}

/* Festività italiane (più San Giovanni, patrono di Torino) */
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
  g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
  mm=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*mm+114)/31),dy=((h+l-7*mm+114)%31)+1;
  return new Date(y,mo-1,dy);
}
function holidays(y){
  const h = {
    [`${y}-01-01`]:"Capodanno",[`${y}-01-06`]:"Epifania",[`${y}-04-25`]:"Liberazione",
    [`${y}-05-01`]:"Festa del lavoro",[`${y}-06-02`]:"Festa della Repubblica",
    [`${y}-06-24`]:"San Giovanni",[`${y}-08-15`]:"Ferragosto",[`${y}-11-01`]:"Ognissanti",
    [`${y}-12-08`]:"Immacolata",[`${y}-12-25`]:"Natale",[`${y}-12-26`]:"Santo Stefano"
  };
  if(y>=2026) h[`${y}-10-04`] = "San Francesco";   /* di nuovo festa nazionale dal 2026 */
  const e = easter(y), p = new Date(e); p.setDate(e.getDate()+1);
  h[iso(e.getFullYear(),e.getMonth(),e.getDate())] = "Pasqua";
  h[iso(p.getFullYear(),p.getMonth(),p.getDate())] = "Pasquetta";
  /* festività aziendali inserite a mano (valgono per tutto il reparto) */
  for(const [k,n] of Object.entries(data.festivita || {})) if(k.startsWith(y+"-") && typeof n==="string" && n) h[k] ??= n;
  return h;
}
function daysOf(y,m){
  const off = (new Date(y,m,1).getDay()+6)%7, n = new Date(y,m+1,0).getDate(), out = [];
  for(let d=1; d<=n; d++) out.push({d, key:iso(y,m,d), dow:(off+d-1)%7, row:Math.floor((off+d-1)/7)});
  return out;
}
/* ---------- Vista mensile o settimanale ---------- */
const SPAN_KEY = "registro-vista";
function mondayOf(k){ const d = keyDate(k); d.setDate(d.getDate() - (d.getDay()+6)%7); return toKey(d); }
function addDays(k, n){ const d = keyDate(k); d.setDate(d.getDate() + n); return toKey(d); }
/* mese "di riferimento" di una settimana: quello del giovedì (come i numeri ISO) */
function syncMonth(){ const t = keyDate(addDays(state.wk, 3)); state.y = t.getFullYear(); state.m = t.getMonth(); }
/* giorni mostrati: il mese intero o i 7 giorni della settimana */
function viewDays(){
  if(state.span!=="week") return daysOf(state.y, state.m);
  return [0,1,2,3,4,5,6].map(i => { const k = addDays(state.wk, i); return {d:Number(k.slice(8)), key:k, dow:i, row:0}; });
}
/* festività degli anni toccati dai giorni mostrati */
function holMap(days){ const h = {}; for(const y of new Set(days.map(x => Number(x.key.slice(0,4))))) Object.assign(h, holidays(y)); return h; }
function viewTitle(){
  if(state.span!=="week") return `${MONTHS[state.m]} ${state.y}`;
  const a = keyDate(state.wk), b = keyDate(addDays(state.wk, 6));
  const da = a.getMonth()===b.getMonth() ? a.getDate() : `${a.getDate()} ${MONTHS[a.getMonth()].slice(0,3).toLowerCase()}`;
  return `Week ${isoWeek(state.wk)}`;
}
/* "2026-W41" <-> lunedì di quella settimana */
function weekInput(k){ const t = keyDate(addDays(k, 3)); return `${t.getFullYear()}-W${String(isoWeek(k)).padStart(2,"0")}`; }
function weekFromInput(v){
  const [y, w] = v.split("-W").map(Number); if(!y || !w) return null;
  const jan4 = iso(y, 0, 4);
  return addDays(mondayOf(jan4), (w-1)*7);
}
function setSpan(s){
  state.span = s; lsSet(SPAN_KEY, s);
  if(s==="week"){
    const t = toKey(now);
    state.wk = t.slice(0,7)===iso(state.y,state.m,1).slice(0,7) ? mondayOf(t) : mondayOf(iso(state.y,state.m,1));
    syncMonth();
  }
  state.sel = null; state.msel = null; render();
}
function stepView(n){
  if(state.span==="week"){ state.wk = addDays(state.wk, 7*n); syncMonth(); }
  else { const d = new Date(state.y, state.m + n, 1); state.y = d.getFullYear(); state.m = d.getMonth(); }
  state.sel = null; state.msel = null; render();
}
function isWorkday(key){
  const [y,m,d] = key.split("-").map(Number);
  const dow = (new Date(y,m-1,d).getDay()+6)%7;
  return dow<5 && !holidays(y)[key];
}
/* totali per settimana: per ferie restituisce anche la divisione F / P */
function weeksOf(cat,p){
  const w = [];
  for(const x of viewDays()){
    const o = w[x.row] ||= {h:0,f:0,p:0};
    o.h += hoursOf(cat,p,x.key);
    if(cat==="ferie"){ o.f += ferF(p,x.key); o.p += ferP(p,x.key); }
  }
  return w;
}

/* Totali del mese */
function monthStats(cat, person){
  const st = {n:0, hours:0, auto:0, ferie:0, par:0, sh:{}};
  for(const x of viewDays()){
    const k = x.key;
    if(cat==="presenze"){
      const v = get("presenze",person,k); if(v===undefined) continue;
      if(isWorkday(k) && absH(person,k) >= DAY_H) continue;
      st.n++; st.hours += worked(person,k);
      const id = sid(v); st.sh[id] = (st.sh[id]||0)+1;
      continue;
    }
    const h = hoursOf(cat,person,k); if(h<=0) continue;
    st.n++; st.hours += h;
    if(cat==="straordinario") st.auto += otAuto(person,k);
    if(cat==="ferie"){ st.ferie += ferF(person,k); st.par += ferP(person,k); }
  }
  return st;
}

/* numero della settimana ISO (W40, W41...) */
function isoWeek(k){
  const [y,m,d] = k.split("-").map(Number), t = new Date(Date.UTC(y,m-1,d));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
/* ---------- Turnazione: rotazione settimanale ---------- */
const ROT_T0 = Date.UTC(2026,8,28);   /* lunedì 28 settembre 2026 */
const ROT = {
  "VINCENZO GENCO":        {seq:["1","2","C"], start:1},
  "MASSIMILIANO TORRENTE": {seq:["1","2","C"], start:0},
  "ERMINIO SICILIA":       {seq:["1","2","C"], start:2},
  "FABRIZIO COPERTINO":    {seq:["1","2"],     start:1},
  "FRANCESCO SERRA":       {seq:["1","2"],     start:0}
};
const TNAME = {"1":"1° turno", "2":"2° turno", "C":"Centrale"};
/* in presenze il 1° e il 2° turno si copiano con la mezz'ora in più (05:30-14, 14-22:30) */
const TO_PRES = {"1":"1L", "2":"2L", "C":"C"};
function planned(p,k){
  const r = ROT[p]; if(!r || !isWorkday(k)) return undefined;
  const [y,m,d] = k.split("-").map(Number), t = Date.UTC(y,m-1,d);
  if(t < ROT_T0) return undefined;
  const w = Math.floor((t - ROT_T0) / (7*864e5));
  return r.seq[(r.start + w) % r.seq.length];
}
/* turno previsto: la modifica a mano ("X" = tolto) prevale sulla rotazione */
function turnOf(p,k){ const o = get("turnazione",p,k); if(o==="X") return undefined; return o!==undefined ? o : planned(p,k); }
const PAINTCAT = () => state.cat==="turnazione" ? "turnazione" : "presenze";
function curShift(p,k){ return state.cat==="turnazione" ? turnOf(p,k) : sid(get("presenze",p,k)); }
function setShift(p,k,v){
  if(state.cat==="turnazione"){
    const b = bucket("turnazione",p);
    if(v===null) { if(planned(p,k)) b[k] = "X"; else delete b[k]; }
    else if(v===planned(p,k)) delete b[k]; else b[k] = v;
    return;
  }
  const b = bucket("presenze",p);
  if(v===null) delete b[k]; else b[k] = v;
}

/* ---------- Interfaccia: vista reparto ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WDL = ["L","M","M","G","V","S","D"];
const WDN = ["lunedì","martedì","mercoledì","giovedì","venerdì","sabato","domenica"];
const CATCOL = {turnazione:"var(--c-turn)", presenze:"var(--c-pres)", straordinario:"var(--c-stra)", ferie:"var(--c-ferie)", malattia:"var(--c-mal)", cigo:"var(--c-cigo)"};
const surname = p => p.split(" ").slice(-1)[0];
const initials = p => p.split(" ").map(w => w[0]).join("").slice(0,2);
const ghost = n => n ? fmt(n) : "–";

/* colonne dei totali a destra */
function totalCols(){
  if(state.cat==="turnazione" || state.cat==="presenze") return [];   /* i totali stanno sotto il nome */
  return summaryCols();
}
/* totali di presenze e turnazione: sotto il nome e nella vista del singolo */
function summaryCols(){
  if(state.cat==="turnazione") return ["1","2","C"].map(t => ({label: t==="C" ? "C" : t+"T", color:`var(${SHIFTS[t].color})`, v:p=>{ let n=0; for(const x of viewDays()) if(turnOf(p,x.key)===t) n++; return n; }}));
  if(state.cat==="presenze") return [
    {label:"Ore", color:"var(--c-pres)", v:p=>sumMonth(p,worked)},
    {label:"Str.", color:"var(--c-stra)", v:p=>sumMonth(p,otDay)},
    {label:"Ferie", color:"var(--c-ferie)", v:p=>sumMonth(p,ferF)},
    {label:"PAR", color:"var(--c-par)", v:p=>sumMonth(p,ferP)},
    {label:"Mal.", color:"var(--c-mal)", v:p=>sumMonth(p,malH)},
    {label:"CIGO", color:"var(--c-cigo)", v:p=>sumMonth(p,cigH)}
  ];
  if(state.span==="week") return [{label:"Settimana", color:CATCOL[state.cat], month:true}];
  const ranges = [];
  for(const x of viewDays()){ const rg = ranges[x.row] ||= [x.d,x.d,x.key]; rg[1] = x.d; }
  const cols = ranges.map((rg,i) => ({label:`W${isoWeek(rg[2])}`, small:`${rg[0]}–${rg[1]}`, color:"var(--muted)", week:i}));
  cols.push({label:"Mese", color:CATCOL[state.cat], month:true});
  return cols;
}
function sumMonth(p, fn){ let t = 0; for(const x of viewDays()) t += fn(p,x.key); return t; }

/* contenuto di una casella della matrice */
function cellHTML(p, x, hol, big){
  const k = x.key, we = x.dow>4 || !!hol[k], sel = state.sel && state.sel.p===p && state.sel.k===k;
  const cls = ["cell"]; if(we) cls.push("we"); if(sel) cls.push("sel");
  if(state.msel && state.msel.set.has(p+"|"+k)) cls.push("rng");
  if(x.nar) cls.push("nar");
  let style = "", inner = "", aria = `${p}, ${x.d} ${MONTHS[state.m]}`;
  const cat = state.cat;
  if(cat==="turnazione"){
    const v = turnOf(p,k), man = get("turnazione",p,k)!==undefined;
    if(v){
      cls.push("shift","tfx"); style = `--ac:var(${SHIFTS[v].color})`;
      const [a,b] = SHIFTS[v].time.split("-"); inner = `<span class="tm"><b>${hhmm(a)}</b><i class="sep"></i><b>${hhmm(b)}</b></span>`;
      aria += `, ${TNAME[v]}`;
    }
    if(man){ inner += `<span class="man" title="Cambiato a mano"></span>`; aria += ", cambiato a mano"; }
  } else if(cat==="presenze"){
    const v = get("presenze",p,k), abs = absList(p,k), ah = absH(p,k), ot = otDay(p,k);
    if(abs.length && (ah>=DAY_H || v===undefined)){
      const a = abs[0];
      cls.push("abs"); style = `--ac:var(${a.color})`;
      const top = a.short, ap = absAP(a,p,k);
      inner = `<span class="t1">${top}</span>${ap ? `<span class="ap">AP</span>` : ""}<span class="t2">${fmt(ah)}</span>`;
      aria += `, ${abs.map(y=>y.label+" "+fmt(y.hours)+" ore").join(", ")}`;
    } else if(v!==undefined){
      /* turno: orario dalle/alle in alto, extra (assenze, straordinario, ore mancanti) nella fascia in basso */
      const id = sid(v), s = SHIFTS[id];
      const [a,b] = id==="M" ? [v.s, v.e] : (s ? s.time.split("-") : ["",""]);
      cls.push("shift","tfx"); style = `--ac:var(${s ? s.color : "--sm"})`;
      const band = abs.map(x => `<span class="bx" style="--mc:var(${x.color})">${x.short} ${fmt(x.hours)}H</span>`);
      if(ot){ band.push(`<span class="bx" style="--mc:var(--c-stra)">+${fmt(ot)}H</span>`); aria += `, straordinario ${fmt(ot)} ore`; }
      const miss = isWorkday(k) && covered(p,k)>0 && covered(p,k)<DAY_H ? DAY_H - covered(p,k) : 0;
      if(miss){ band.push(`<span class="bx" style="--mc:var(--weekend)" title="Mancano ${fmt(miss)} ore">−${fmt(miss)}H</span>`); aria += `, mancano ${fmt(miss)} ore`; }
      const missDot = miss ? `<span class="missc" title="Mancano ${fmt(miss)} ore"></span>` : "";
      inner = missDot + `<span class="tm"><b>${hhmm(a)}</b><i class="sep"></i><b>${hhmm(b)}</b></span>` + (band.length ? `<span class="band">${band.join("")}</span>` : "");
      aria += `, turno ${timeLabel(v)}`;
    }
    if(!cls.includes("tfx")){
      if(ot) { inner += `<span class="ot">${fmt(ot).length>3 ? fmt(ot) : "+"+fmt(ot)}</span>`; aria += `, straordinario ${fmt(ot)} ore`; }
      if(isWorkday(k) && covered(p,k)>0 && covered(p,k)<DAY_H){ inner += `<span class="missc" title="Mancano ${fmt(DAY_H-covered(p,k))} ore"></span>`; aria += `, mancano ${fmt(DAY_H-covered(p,k))} ore`; }
    }
  } else {
    /* schede delle ore: "+", le ore, la voce, "ORE", uno sotto l'altro e centrati */
    const stk = rows => `<span class="stk">${rows.map(r => `<b class="${r[1]||""}">${r[0]}</b>`).join("")}</span>`;
    if(cat==="ferie"){
      const f = ferF(p,k), pp = ferP(p,k), vh = visH(p,k);
      const parts = [];
      if(f) parts.push(["FER" + (ferA(p,k) ? " AP" : ""), f, "--c-ferie"]);
      if(pp) parts.push(["PAR" + (parA(p,k) ? " AP" : ""), pp, "--c-par"]);
      if(vh) parts.push(["VIS", vh, "--c-vis"]);
      if(parts.length){
        cls.push("val"); style = `--ac:var(${parts[0][2]})`;
        inner = parts.length===1
          ? stk([["+"], [parts[0][0]], [fmt(parts[0][1]), "n"], ["ORE"]])
          : stk([["+"], ...parts.map(x => [`${x[0]} ${fmt(x[1])}`, "m"]), ["ORE"]]);
        aria += `, ${parts.map(x => `${x[0]} ${fmt(x[1])} ore`).join(", ")}`;
      }
    } else {
      const h = hoursOf(cat,p,k);
      if(h>0){
        cls.push("val"); style = `--ac:${CATCOL[cat]}`;
        const lab = cat==="malattia" ? "MAL" + (malE(p,k).a==="AP" ? " AP" : "") : cat==="cigo" ? "CIGO" : "";
        inner = stk([["+"], ...(lab ? [[lab]] : []), [fmt(h), "n"], ["ORE"]]);
        aria += `, ${fmt(h)} ore`;
      }
    }
  }
  /* festivo: casella vuota tutta rossa con una F grande; se c'è un turno o una voce resta la scritta FEST */
  const filled = cls.some(c => c==="shift" || c==="val" || c==="abs");
  if(hol[k]){
    cls.push("hol"); aria += `, festivo (${hol[k]})`;
    if(!filled){ cls.push("holfill"); inner = `<span class="hf" title="${hol[k]}">F</span>` + inner; }
    else if(!big) inner = `<span class="fest" title="${hol[k]}"></span>` + inner;
  }
  if(hasNote(p,k)) inner += `<span class="star" aria-hidden="true">*</span>`;
  if(big){ cls.push("lg"); inner = `<span class="dn">${x.d}</span>` + (hol[k] ? `<span class="fest hn">FEST · ${hol[k]}</span>` : "") + inner; }
  return `<button class="${cls.join(" ")}" data-p="${esc(p)}" data-date="${k}" style="${style}" aria-label="${esc(aria)}">${inner}</button>`;
}

/* scelta della vista: tutto il reparto o una persona sola */
function renderViewbar(){

/* calendario di una persona sola, a settimane */
function renderSingle(p){
  const {cat} = state, days = viewDays(), hol = holMap(days);
  const off = state.span==="week" ? 0 : (new Date(state.y,state.m,1).getDay()+6)%7, rows = Math.ceil((off+days.length)/7);
  const weNar = days.filter(x => x.dow>4).every(x => !dayHasData(p, x.key));
  const nm = p.split(" "), last = nm.pop();
  let html = `<div class="s-head"><span><b>${esc(nm.join(" "))} ${esc(last)}</b><small>${viewTitle()}</small></span></div>`;
  html += `<div class="single"${weNar ? ` style="grid-template-columns:repeat(5,minmax(0,1fr)) 46px 46px 110px"` : ""}>` + ["LUN","MAR","MER","GIO","VEN","SAB","DOM"].map((w,i) => `<div class="s-wd${i>4?" we":""}">${weNar && i>4 ? w[0] : w}</div>`).join("") + `<div class="s-wd">SETT.</div>`;
  for(let r=0; r<rows; r++){
    const wk = [];
    for(let c=0; c<7; c++){
      const i = r*7 + c - off;
      if(i<0 || i>=days.length){ html += `<div class="s-empty"></div>`; continue; }
      wk.push(days[i].key);
      html += cellHTML(p, weNar && days[i].dow>4 ? {...days[i], nar:true} : days[i], hol, true);
    }
    let main = "", sub = "";
    if(cat==="turnazione"){ const t = wk.map(k => turnOf(p,k)).find(Boolean); main = t ? TNAME[t] : "–"; }
    else if(cat==="presenze"){
      const w = wk.reduce((a,k) => a + worked(p,k), 0), o = wk.reduce((a,k) => a + otDay(p,k), 0);
      main = w ? `${fmt(w)} ore lavorate` : "–"; sub = o ? `+${fmt(o)} str.` : "";
    } else if(cat==="ferie"){
      const f = wk.reduce((a,k) => a + ferF(p,k), 0), pp = wk.reduce((a,k) => a + ferP(p,k), 0);
      main = f+pp ? `${fmt(f+pp)} h` : "–"; sub = f && pp ? `F ${fmt(f)} · P ${fmt(pp)}` : pp ? "PAR" : f ? "ferie" : "";
    } else { const h = wk.reduce((a,k) => a + hoursOf(cat,p,k), 0); main = h ? `${fmt(h)} h` : "–"; }
    html += `<div class="s-wk"><span class="wn">W${isoWeek(wk[0])}</span><b>${main}</b>${sub ? `<small>${sub}</small>` : ""}</div>`;
  }
  html += `</div>`;
  /* totali del mese */
  let tots;
  if(cat==="presenze" || cat==="turnazione") tots = summaryCols().map(c => ({label:c.label, color:c.color, v: c.label==="Str." && c.v(p) ? "+"+fmt(c.v(p)) : ghost(c.v(p))}));
  else if(cat==="ferie") tots = [{label:"Ferie", color:"var(--c-ferie)", v:ghost(sumMonth(p,ferF))},{label:"PAR", color:"var(--c-par)", v:ghost(sumMonth(p,ferP))}];
  else tots = [{label:state.span==="week" ? "Settimana" : "Mese", color:CATCOL[cat], v:ghost(sumMonth(p,(q,k)=>hoursOf(cat,q,k)))}];
  html += `<div class="s-tots">${tots.map(t => `<span class="s-tot" style="color:${t.color}"><small>${t.label}</small><b>${t.v}</b></span>`).join("")}</div>`;
  $("matrix").innerHTML = html;
  $("matrix").classList.add("one");
}
/* sabati e domeniche senza niente inserito: colonna stretta (resta solo il numero) */
function dayHasData(p, k){
  const cat = state.cat;
  if(cat==="turnazione") return !!turnOf(p,k) || !!noteOf(p,k);
  if(cat==="presenze") return ["presenze","straordinario","ferie","malattia","cigo","visita","mensa","note"].some(c => get(c,p,k)!==undefined);
  if(cat==="ferie") return hoursOf("ferie",p,k)>0 || visH(p,k)>0;
  return hoursOf(cat,p,k)>0;
}
const narrowDay = (x, hol, ps = PEOPLE) => x.dow>4 && !ps.some(p => dayHasData(p, x.key));   /* solo sabato e domenica */
function renderMatrix(){
  if(state.view){ renderSingle(state.view); return; }
  $("matrix").classList.remove("one");
  $("matrix").classList.toggle("wkv", state.span==="week");
  const {cat} = state, days = viewDays(), hol = holMap(days), cols = totalCols();
  const todayIso = iso(now.getFullYear(),now.getMonth(),now.getDate());
  const nar = days.map(x => narrowDay(x, hol));
  const colsCss = `112px ${days.map((x,i) => nar[i] ? "26px" : "minmax(0,1fr)").join(" ")} ${cols.length ? `repeat(${cols.length}, 38px)` : ""}`;
  $("matrix").style.setProperty("--cols", colsCss);
  /* numero della settimana, al centro dei suoi giorni */
  let html = `<div class="row wkrow"><div></div>`;
  for(let i=0; i<days.length; ){
    let n = 1; while(i+n<days.length && days[i+n].row===days[i].row) n++;
    html += `<div class="wkl" style="grid-column:span ${n}">W${isoWeek(days[i].key)}</div>`;
    i += n;
  }
  html += (cols.length ? `<div style="grid-column:span ${cols.length}"></div>` : "") + `</div>`;
  html += `<div class="row head"><div class="hname">Dipendente</div>`;
  for(const x of days){
    const we = x.dow>4 || hol[x.key];
    const nr = nar[days.indexOf(x)];
    html += `<div class="dh${we?" we":""}${hol[x.key]?" hol":""}${nr?" nar":""}${x.key===todayIso?" now":""}" title="${hol[x.key]||""}"><span>${WDL[x.dow]}</span><b>${x.d}</b></div>`;
  }
  for(const c of cols) html += `<div class="th" style="color:${c.color}">${c.label}${c.small?`<small>${c.small}</small>`:""}</div>`;
  html += `</div>`;

  const colTot = cols.map(() => ({h:0,f:0,p:0}));
  for(const p of PEOPLE){
    const st = monthStats("presenze", p);
    const on = p===state.person;
    const nm = p.split(" "), last = nm.pop();
    /* colonna del nome: "F. COPERTINO" su una riga, poi giorni e ore, poi una riga per ogni voce presente */
    const lines = [];
    if(cat==="presenze"){
      const [ore, str, fer, par, mal, cig] = summaryCols().map(c => c.v(p));
      lines.push(`<span style="color:var(--muted)">${st.n} GG</span> · <span style="color:var(--c-pres)">${fmt(ore)} ORE</span>`);
      if(str) lines.push(`<span style="color:var(--c-stra)">+${fmt(str)} ORE EXTRA</span>`);
      if(fer) lines.push(`<span style="color:var(--c-ferie)">+${fmt(fer)} H FERIE</span>`);
      if(par) lines.push(`<span style="color:var(--c-par)">+${fmt(par)} H PAR</span>`);
      if(mal) lines.push(`<span style="color:var(--c-mal)">+${fmt(mal)} ORE MALATTIA</span>`);
      if(cig) lines.push(`<span style="color:var(--c-cigo)">+${fmt(cig)} ORE CIGO</span>`);
    } else if(cat==="turnazione"){
      lines.push(summaryCols().map(c => `<span style="color:${c.color}">${c.label} ${c.v(p) || "–"}</span>`).join(" · "));
      const t = weekTurn(p); lines.push(t ? `W${isoWeek(toKey(new Date()))}: ${TNAME[t].toUpperCase()}` : "NESSUN TURNO");
    } else lines.push(`${st.n} GG`);
    const shortName = `${nm.map(w => w[0] + ".").join(" ")} ${last}`;
    html += `<div class="row prow${on?" on":""}"><button class="pname" data-p="${esc(p)}"><span class="pn" title="${esc(p)}"><b>${esc(shortName)}</b>${lines.map(l => `<small>${l}</small>`).join("")}</span></button>`;
    days.forEach((x,i) => { html += cellHTML(p, nar[i] ? {...x, nar:true} : x, hol); });
    const weeks = (cat==="presenze" || cat==="turnazione") ? null : weeksOf(cat,p);
    cols.forEach((c,i) => {
      let txt;
      if(cat==="presenze" || cat==="turnazione"){ const v = c.v(p); colTot[i].h += v; txt = c.label==="Str." && v ? "+"+fmt(v) : ghost(v); }
      else {
        const o = c.month ? weeks.reduce((a,w)=>({h:a.h+w.h,f:a.f+w.f,p:a.p+w.p}),{h:0,f:0,p:0}) : (weeks[c.week]||{h:0,f:0,p:0});
        colTot[i].h += o.h; colTot[i].f += o.f; colTot[i].p += o.p;
        txt = cat==="ferie" && (o.f||o.p) ? `<span class="fp">F ${fmt(o.f)}</span><span class="fp">P ${fmt(o.p)}</span>` : ghost(o.h);
      }
      html += `<div class="tc${c.month?" month":""}" style="color:${c.color}">${txt}</div>`;
    });
    html += `</div>`;
  }

  /* riga dei totali */
  html += `<div class="row foot"><div class="fname">${cat==="presenze" ? "Presenti" : cat==="turnazione" ? "In turno" : "Totale giorno"}</div>`;
  for(const x of days){
    let v = 0;
    for(const p of PEOPLE){
      if(cat==="turnazione"){ if(turnOf(p,x.key)) v++; }
      else if(cat==="presenze"){ const d = get("presenze",p,x.key); if(d!==undefined && !(isWorkday(x.key) && absH(p,x.key)>=DAY_H)) v++; }
      else v += hoursOf(cat,p,x.key);
    }
    html += `<div class="fd">${v ? fmt(v) : ""}</div>`;
  }
  cols.forEach((c,i) => {
    const o = colTot[i];
    const txt = cat==="ferie" && (o.f||o.p) ? `<span class="fp">F ${fmt(o.f)}</span><span class="fp">P ${fmt(o.p)}</span>` : (c.label==="Str." && o.h ? "+"+fmt(o.h) : ghost(o.h));
    html += `<div class="tc total" style="color:${c.color}">${txt}</div>`;
  });
  html += `</div>`;
  $("matrix").innerHTML = html;
}

function weekTurn(p){
  const t = new Date(), dow = (t.getDay()+6)%7;
  for(let i=0;i<5;i++){ const d = new Date(t.getFullYear(), t.getMonth(), t.getDate()-dow+i); const v = turnOf(p, iso(d.getFullYear(), d.getMonth(), d.getDate())); if(v) return v; }
  return planned(p, iso(t.getFullYear(), t.getMonth(), t.getDate()-dow)) || null;
}

  for(const p of PEOPLE.slice(i[0], i[1]+1)) for(const x of viewDays()) if(x.key>=a && x.key<=b) out.push({p, k:x.key});

}

    if(a==="reset") return commit(() => { pairs.forEach(({p,k}) => { delete bucket("turnazione",p)[k]; }); state.msel = null; });
    if(a==="copyday") return commit(() => { pairs.forEach(({p,k}) => { const t = turnOf(p,k); if(t) bucket("presenze",p)[k] = TO_PRES[t]; }); state.msel = null; });
    if(a==="clear") return commit(() => { pairs.forEach(({p,k}) => { for(const c of ALLCATS) delete bucket(c,p)[k]; }); state.msel = null; });
    const list = a==="straordinario" ? pairs : work;
    if(!list.length){ alertMsg("Nella selezione non ci sono giorni lavorativi."); return; }
    if(a==="time") return openTimeMulti(list);
    return openHoursMulti(list, a);
  }
  if(!state.sel) return;
  const {p, k} = state.sel; state.person = p;
  if(a==="reset") return commit(() => { delete bucket("turnazione",p)[k]; });
  if(a==="copyday") return commit(() => { bucket("presenze",p)[k] = TO_PRES[turnOf(p,k)]; });
  if(a==="time") return openTime(k);
  if(a==="hol") return openHol(k);
  if(a==="note") return openNote([{p,k}]);
  if(a==="clear") return commit(() => { for(const c of ALLCATS) delete bucket(c,p)[k]; });
  openHours(k, a);
});

  applyShift(map[e.key]);
});

/* scrive le ore di una categoria (per ferie: il tipo scelto; year "AP"/"" o undefined = lascia com'è) */
function writeHours(cat, key, v, type, year, note, cig){
  const b = bucket(cat, state.person);
  if(cat==="ferie"){
    const old = get("ferie",state.person,key) || {};
    const o = {f:ferF(state.person,key), p:ferP(state.person,key)};
    o[type] = isNaN(v)||v<0 ? 0 : v;
    const ya = type==="f" && year!==undefined ? year : old.a, yp = type==="p" && year!==undefined ? year : old.pa;
    if(o.f && ya==="AP") o.a = "AP";
    if(o.p && yp==="AP") o.pa = "AP";
    const n = note!==undefined ? note.trim() : (old.n || "");
    if(n) o.n = n;
    const cf = type==="f" && cig!==undefined ? cig : old.fc, cp = type==="p" && cig!==undefined ? cig : old.pc;
    if(o.f && cf) o.fc = true;
    if(o.p && cp) o.pc = true;
    if(o.f+o.p>0) b[key] = o; else delete b[key];
    return;
  }
  if(cat==="malattia"){
    /* numero semplice se non ci sono extra, altrimenti {h, a, c, n} */
    if(isNaN(v) || v<=0){ delete b[key]; return; }
    const old = malE(state.person,key), o = {h:v};
    if((year!==undefined ? year : old.a)==="AP") o.a = "AP";
    if(cig!==undefined ? cig : old.c) o.c = true;
    const n = note!==undefined ? note.trim() : (old.n || "");
    if(n) o.n = n;
    b[key] = o.a || o.c || o.n ? o : v;
    return;
  }
  if(isNaN(v) || v<=0) delete b[key]; else b[key] = v;
}
/* commento libero: scrive o toglie il commento della casella */
function setNote(p, k, n){ n = (n || "").trim(); if(n) bucket("note",p)[k] = n; else delete bucket("note",p)[k]; }
function saveHours(v){
  const key = editing, cat = dlgMode, ext = EXTRA.includes(cat), txt = $("ferNote").value;
  if(multiKeys){
    /* più caselle: un commento vuoto lascia com'erano quelli già scritti */
    const ks = multiKeys, note = ext && txt.trim() ? txt : undefined, cig = ext ? ferieCig : undefined; multiKeys = null;
    commit(() => {
      ks.forEach(({p,k}) => { state.person = p; writeHours(cat, k, v, ferieType, ext ? ferieYear : undefined, note, cig); if(!ext && txt.trim()) setNote(p, k, txt); });
      state.msel = null;
    });
    return;
  }
  commit(() => {
    writeHours(cat, key, v, ferieType, ext ? ferieYear : undefined, ext ? txt : undefined, ext ? ferieCig : undefined);
    if(!ext) setNote(state.person, key, txt);
  });
  if(cat!=="straordinario") askRest(key);
}

  if(dlgMode==="time") commit(() => { delete bucket("presenze", state.person)[key]; });

/* Popup ore mancanti: se la giornata non arriva a 8 ore */
let restKey = null;
function askRest(key){
  if(!isWorkday(key)) return;
  const c = covered(state.person, key);
  if(c<=0 || c>=DAY_H) return;
  restKey = key;
  const miss = DAY_H - c;
  const parts = [];
  if(worked(state.person,key)) parts.push(`${fmt(worked(state.person,key))} h lavorate`);
  for(const a of absList(state.person,key)) parts.push(`${fmt(a.hours)} h ${absName(a,state.person,key)}`);
  $("restTitle").textContent = `Mancano ${fmt(miss)} ore`;
  $("restSub").textContent = `${dateLabel(key)}: ${parts.join(", ")}. A cosa assegni le ore mancanti?`;
  $("restHours").value = r2(miss);
  /* ferie e PAR hanno un solo anno per giorno: se ce ne sono già, l'altro anno non si può aggiungere */
  $("restBtns").querySelectorAll("[data-c=f],[data-c=p]").forEach(b => {
    const c = b.dataset.c, has = (c==="f" ? ferF : ferP)(state.person,key), y = (c==="f" ? ferA : parA)(state.person,key);
    b.disabled = !!has && (b.dataset.y || "") !== y;
  });
  // piccolo ritardo: il primo popup si deve chiudere prima
  setTimeout(() => { if(!$("rest").open) $("rest").showModal(); }, 0);
}
$("restBtns").addEventListener("click", e => {
  const x = e.target.closest("button[data-c]"); if(!x) return;
  const v = parseFloat(String($("restHours").value).replace(",","."));
  const key = restKey, c = x.dataset.c;
  $("rest").close();
  if(isNaN(v) || v<=0) return;
  commit(() => {
    if(c==="f" || c==="p") writeHours("ferie", key, (c==="f"?ferF:ferP)(state.person,key) + v, c, x.dataset.y);
    else writeHours(c, key, hoursOf(c,state.person,key) + v);
  });
});

/* Esportazione Excel */
async function loadExcelJS(){
  if(window.ExcelJS) return window.ExcelJS;
  await new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js";
    s.onload = ok; s.onerror = ko; document.head.appendChild(s);
  });
  return window.ExcelJS;
}
function colName(n){ let s=""; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }
/* testo e colore della riga Turno: l'assenza di giornata intera prevale */
function xlDay(p,k){
  const v = get("presenze",p,k), abs = absList(p,k);
  if(abs.length && (absH(p,k) >= DAY_H || v===undefined)) return {text:absShort(abs[0],p,k), hex:abs[0].hex};
  if(v===undefined) return {text:"", hex:null};
  return {text:timeLabel(v), hex:SHIFTS[sid(v)]?.hex || "5f6773"};
}

async function saveFile(name, blob){
  let dl = null;
  try{ if(window.claude?.use) dl = await window.claude.use("downloads"); }catch(e){}
  if(dl){
    try{ await dl.save({filename:name, data:blob}); }catch(e){ if(e?.code!=="declined") throw e; }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* PDF della turnazione: A3 orizzontale, 4 mesi dal mese mostrato, 2 per riga */
const PDF_COL = {"1":[56,189,248], "2":[52,211,153], "C":[251,191,36]};
const PDF_INK = [22,25,31], PDF_GREY = [110,116,128], PDF_LINE = [214,218,224], PDF_WE = [253,236,236], PDF_WEINK = [210,40,50];
const pdfLab = v => v==="C" ? "C" : v+"T";
/* disegna un mese dentro il riquadro (bx,by,bw,bh), centrato */
function pdfMonth(doc, y, m, bx, by, bw, bh){
  const days = daysOf(y,m), hol = holidays(y), N = days.length;
  const nameW = 32, totW = 9, dayW = (bw - nameW - 3*totW) / 31;
  const gridW = nameW + N*dayW + 3*totW, x0 = bx + (bw - gridW)/2;   /* mesi corti: tabella al centro */
  const titleH = 9, headH = 10, rowH = Math.min(20, (bh - titleH - headH) / PEOPLE.length);
  const usedH = titleH + headH + rowH*PEOPLE.length, y0 = by + (bh - usedH)/2;
  const top = y0 + titleH, WDS = ["L","M","M","G","V","S","D"];

  doc.setFont("helvetica","bold"); doc.setFontSize(14); doc.setTextColor(...PDF_INK);
  doc.text(`${MONTHS[m]} ${y}`, x0 + gridW/2, y0 + 6, {align:"center"});

  doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(...PDF_GREY);
  doc.text("Dipendente", x0 + 1, top + 7);
  days.forEach((x,i) => {
    const cx = x0 + nameW + i*dayW, we = x.dow>4 || hol[x.key];
    if(we){ doc.setFillColor(...PDF_WE); doc.rect(cx, top, dayW, headH + rowH*PEOPLE.length, "F"); }
    doc.setTextColor(...(we ? PDF_WEINK : PDF_GREY)); doc.setFont("helvetica", hol[x.key] ? "bold" : "normal"); doc.setFontSize(6);
    doc.text(WDS[x.dow], cx + dayW/2, top + 3.6, {align:"center"});
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...(we ? PDF_WEINK : PDF_INK));
    doc.text(String(x.d), cx + dayW/2, top + 8, {align:"center"});
  });
  ["1","2","C"].forEach((k,j) => {
    const cx = x0 + nameW + N*dayW + j*totW;
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...PDF_INK);
    doc.text(pdfLab(k), cx + totW/2, top + 8, {align:"center"});
    doc.setFillColor(...PDF_COL[k]); doc.rect(cx + 1.5, top + 1.5, totW - 3, 1.2, "F");
  });

  PEOPLE.forEach((p, r) => {
    const ry = top + headH + r*rowH;
    doc.setDrawColor(...PDF_LINE); doc.setLineWidth(0.2);
    doc.line(x0, ry, x0 + gridW, ry);
    const nm = p.split(" "), last = nm.pop();
    doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(...PDF_INK);
    doc.text(nm.join(" "), x0 + 1, ry + rowH/2 - 0.8);
    doc.setFont("helvetica","bold"); doc.setFontSize(8.5);
    doc.text(last, x0 + 1, ry + rowH/2 + 3.2);
    const cnt = {"1":0,"2":0,"C":0};
    days.forEach((x,i) => {
      const v = turnOf(p, x.key);
      if(!v){   /* festivo senza turno: F al posto del turno */
        if(hol[x.key]){ doc.setFont("helvetica","bold"); doc.setFontSize(7.5); doc.setTextColor(...PDF_WEINK); doc.text("F", x0 + nameW + i*dayW + dayW/2, ry + rowH/2 + 1.2, {align:"center"}); }
        return;
      }
      cnt[v]++;
      const cx = x0 + nameW + i*dayW;
      doc.setFillColor(...PDF_COL[v]);
      doc.roundedRect(cx + 0.35, ry + 1, dayW - 0.7, rowH - 2, 0.8, 0.8, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(v==="C" ? 8 : 6.5); doc.setTextColor(...PDF_INK);
      doc.text(pdfLab(v), cx + dayW/2, ry + rowH/2 + 1.1, {align:"center"});
    });
    ["1","2","C"].forEach((k,j) => {
      const cx = x0 + nameW + N*dayW + j*totW;
      doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(...(cnt[k] ? PDF_INK : PDF_GREY));
      doc.text(cnt[k] ? String(cnt[k]) : "–", cx + totW/2, ry + rowH/2 + 1.2, {align:"center"});
    });
  });
  const bottom = top + headH + rowH*PEOPLE.length;
  doc.setDrawColor(...PDF_LINE); doc.line(x0, bottom, x0 + gridW, bottom);
}
async function exportPDF(){
  const btn = $("pdfBtn"), old = btn.textContent;
  btn.textContent = "Preparo il PDF…"; btn.disabled = true;
  try{
    const jsPDF = await loadJsPDF();
    const doc = new jsPDF({orientation:"landscape", unit:"mm", format:"a3"});
    const W = 420, H = 297, M = 14, GX = 14, GY = 10;
    const months = [0,1,2,3].map(i => { const d = new Date(state.y, state.m + i, 1); return [d.getFullYear(), d.getMonth()]; });
    const [fy,fm] = months[0], [ly,lm] = months[3];

    /* titolo e legenda, centrati */
    doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.setTextColor(...PDF_INK);
    doc.text(`Turnazione manutenzione: ${MONTHS[fm]}${fy === ly ? "" : " " + fy} – ${MONTHS[lm]} ${ly}`, W/2, 18, {align:"center"});
    const leg = [["1","1° turno 06-14"],["2","2° turno 14-22"],["C","Centrale 07-15"]], legW = 46;
    let lx = W/2 - (leg.length*legW)/2;
    for(const [k,t] of leg){
      doc.setFillColor(...PDF_COL[k]); doc.roundedRect(lx, 23, 9, 6, 1, 1, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...PDF_INK);
      doc.text(pdfLab(k), lx + 4.5, 27.2, {align:"center"});
      doc.setFont("helvetica","normal"); doc.setTextColor(...PDF_GREY);
      doc.text(t, lx + 11, 27.2);
      lx += legW;
    }

    /* 4 riquadri 2x2 */
    const top = 34, foot = 10;
    const bw = (W - 2*M - GX) / 2, bh = (H - top - foot - GY) / 2;
    months.forEach(([yy,mm], i) => pdfMonth(doc, yy, mm, M + (i%2)*(bw + GX), top + Math.floor(i/2)*(bh + GY), bw, bh));

    const t = new Date();
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...PDF_GREY);
    doc.text(`Giorni in rosso: sabato, domenica e festivi (F nella casella). Totali a destra: giorni di 1° turno, 2° turno e centrale nel mese. Stampato il ${t.getDate()}/${t.getMonth()+1}/${t.getFullYear()}.`, W/2, H - 6, {align:"center"});

    const blob = doc.output("blob");
    await saveFile(`Turnazione manutenzione ${MONTHS[fm]} ${fy} - ${MONTHS[lm]} ${ly}.pdf`, blob);
  }catch(err){
    console.error(err);
    alertMsg("Non riesco a creare il PDF. Controlla di essere connesso a internet e riprova.");
  }finally{
    btn.textContent = old; btn.disabled = false;
  }
}
